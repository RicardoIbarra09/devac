[tool.poetry]
name = "devac"
version = "0.1.0"
description = "DEvAC — Context-aware, event-driven access control model"
authors = ["RicardoIbarra09"]
packages = [
    { include = "devac" },
    { include = "devac_api" },
    { include = "devac_client" },
    { include = "devac_sim" },
]

[tool.poetry.scripts]
devac-loadgen = "devac_client.loadgen:main"
devac-sim = "devac_sim.cli:main"

[tool.poetry.dependencies]
python     = ">=3.10,<4"
pydantic   = "^2.11.4"
networkx   = "^3.4.2"
numpy      = "1.24.0"
option     = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest     = "^8.0.0"

[tool.poetry.group.api.dependencies]
fastapi = "^0.161.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
httpx = "^0.28.1"

[tool.poetry.group.charts.dependencies]
matplotlib = "^3.7"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
